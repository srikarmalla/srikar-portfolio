<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Srikar Malla | CSE Student & Developer</title>

    <meta
      name="description"
      content="Srikar Malla is a Computer Science and Engineering student and developer building web applications, machine learning projects, and embedded systems projects."
    />

    <meta
      name="author"
      content="Srikar Malla"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://srikarmalla.dev/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/mylogo.png"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Srikar Malla | CSE Student & Developer"
    />

    <meta
      property="og:description"
      content="Portfolio of Srikar Malla — Computer Science and Engineering student and developer."
    />

    <meta
      property="og:url"
      content="https://srikarmalla.dev/"
    />

    <meta
      property="og:site_name"
      content="Srikar Malla"
    />

    <meta
      property="og:image"
      content="https://srikarmalla.dev/mylogo.png"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Srikar Malla | CSE Student & Developer"
    />

    <meta
      name="twitter:description"
      content="Portfolio of Srikar Malla — Computer Science and Engineering student and developer."
    />

    <meta
      name="twitter:image"
      content="https://srikarmalla.dev/mylogo.png"
    />

    <!-- WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Srikar Malla",
        "alternateName": "Srikar Malla Portfolio",
        "url": "https://srikarmalla.dev/"
      }
    </script>

    <!-- Person structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Srikar Malla",
        "url": "https://srikarmalla.dev/",
        "jobTitle": "Computer Science and Engineering Student",
        "sameAs": [
          "https://github.com/srikarmalla"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
